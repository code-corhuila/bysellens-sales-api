spring.application.name=sales-service
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bysellens_db}?currentSchema=sales
spring.datasource.username=${DB_USER:sales_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=sales
spring.flyway.default-schema=sales
spring.flyway.schemas=sales
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
customer.url=${CUSTOMER_URL:http://customer-service:8080}
product.url=${PRODUCT_URL:http://product-service:8080}
inventory.url=${INVENTORY_URL:http://inventory-service:8080}
sales.url=${SALES_URL:http://sales-service:8080}
logging.pattern.level=%5p [requestId=%X{requestId}]

# No truncar cantidades ni identificadores decimales en el contrato de ventas.
spring.jackson.deserialization.accept-float-as-int=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:bysellens}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
